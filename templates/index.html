<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --panel: #10151f;
    --panel-2: #161d2b;
    --border: #232c3d;
    --border-soft: #1a2130;
    --text: #e7eaf0;
    --text-dim: #8991a3;
    --text-faint: #5b6376;
    --amber: #f0b429;
    --amber-dim: #8a6a1f;
    --safe: #3ecf8e;
    --safe-bg: #0e1f18;
    --danger: #ff6b6b;
    --danger-bg: #241213;
    --sans: 'IBM Plex Sans', -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    background-image:
      linear-gradient(var(--border-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
    background-size: 42px 42px;
    background-position: center top;
    color: var(--text);
    margin: 0;
    min-height: 100vh;
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 48px 20px 80px; }

  /* ---------- Header ---------- */
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .brand svg { flex-shrink: 0; }
  .brand h1 {
    font-size: 21px; font-weight: 600; letter-spacing: -0.01em; margin: 0; color: var(--text);
  }
  .subtitle { color: var(--text-dim); font-size: 14.5px; margin: 0 0 32px 36px; line-height: 1.5; max-width: 46ch; }

  /* ---------- Panels (shared) ---------- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .panel-pad { padding: 22px; }

  /* ---------- Auth: signed out ---------- */
  #authPanel { margin-bottom: 28px; }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
  }
  .panel-head span { font-size: 12.5px; color: var(--text-faint); font-family: var(--mono); }

  #googleBtn {
    width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 11px; border-radius: 5px; font-size: 14px; font-weight: 500; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: border-color .15s ease, background .15s ease;
  }
  #googleBtn:hover { border-color: #3a4559; background: #1c2436; }

  .divider { display: flex; align-items: center; gap: 12px; color: var(--text-faint); font-size: 12.5px; margin: 18px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 10px 12px; border-radius: 5px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 14px; font-family: var(--sans);
    transition: border-color .15s ease;
  }
  .field input:focus { outline: none; border-color: var(--amber-dim); }

  .auth-actions { display: flex; gap: 8px; margin-top: 16px; }
  .btn {
    padding: 10px 16px; border-radius: 5px; border: 1px solid transparent; font-weight: 500;
    font-size: 13.5px; cursor: pointer; font-family: var(--sans);
  }
  .btn-primary { background: var(--amber); color: #1a1305; }
  .btn-primary:hover { background: #f7c34f; }
  .btn-ghost { background: transparent; color: var(--text-dim); border-color: var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: #3a4559; }
  .btn:disabled { opacity: .5; cursor: default; }

  .auth-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
  .link-btn {
    background: none; border: none; color: var(--text-faint); font-size: 12.5px; cursor: pointer;
    padding: 0; text-decoration: underline; text-underline-offset: 2px;
  }
  .link-btn:hover { color: var(--text-dim); }
  .form-msg { font-size: 12.5px; margin-top: 10px; min-height: 16px; }
  .form-msg.err { color: var(--danger); }
  .form-msg.ok { color: var(--safe); }

  /* ---------- Auth: signed in ---------- */
  #userBar {
    display: none; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px; margin-bottom: 28px;
  }
  .user-id { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .user-id img { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; }
  .avatar-fallback {
    width: 30px; height: 30px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--text-dim); flex-shrink: 0;
  }
  .user-id .who { min-width: 0; }
  .user-id .name { font-size: 13.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-id .status { font-size: 11.5px; color: var(--text-faint); }
  .user-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    background: none; border: 1px solid transparent; color: var(--text-faint); width: 30px; height: 30px;
    border-radius: 5px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--border); background: var(--panel-2); }

  #verifyBanner {
    display: none; font-size: 12.5px; color: var(--amber); background: rgba(240,180,41,0.08);
    border: 1px solid var(--amber-dim); border-radius: 5px; padding: 10px 14px; margin: -18px 0 28px;
  }
  #verifyBanner a { color: var(--amber); }

  /* ---------- Change password panel ---------- */
  #pwPanel { display: none; margin-bottom: 28px; overflow: hidden; }
  #pwPanel .panel-pad { padding-top: 18px; }
  .pw-note { font-size: 13px; color: var(--text-dim); line-height: 1.6; }

  /* ---------- Scanner ---------- */
  .scan-row { display: flex; gap: 8px; margin-bottom: 24px; }
  #urlInput {
    flex: 1; padding: 13px 14px; border-radius: 5px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 14px; font-family: var(--mono);
  }
  #urlInput:focus { outline: none; border-color: var(--amber-dim); }
  #urlInput::placeholder { color: var(--text-faint); }
  #checkBtn {
    background: var(--amber); color: #1a1305; border: none; padding: 13px 20px; border-radius: 5px;
    font-weight: 600; font-size: 13.5px; cursor: pointer; position: relative; overflow: hidden; white-space: nowrap;
  }
  #checkBtn:hover { background: #f7c34f; }
  #checkBtn:disabled { cursor: default; color: #1a1305; }
  #checkBtn .sweep {
    position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
    transform: translateX(-100%); display: none;
  }
  #checkBtn.scanning .sweep { display: block; animation: sweep 1s linear infinite; }
  @keyframes sweep { to { transform: translateX(100%); } }

  #result { display: none; border-radius: 6px; padding: 22px; margin-bottom: 28px; border: 1px solid; border-left-width: 3px; }
  #result.legit { background: var(--safe-bg); border-color: var(--border); border-left-color: var(--safe); }
  #result.phish { background: var(--danger-bg); border-color: var(--border); border-left-color: var(--danger); }
  .result-top { display: flex; align-items: center; justify-content: space-between; }
  .result-label { font-size: 15px; font-weight: 600; }
  #result.legit .result-label { color: var(--safe); }
  #result.phish .result-label { color: var(--danger); }
  .result-conf { font-size: 12.5px; color: var(--text-dim); font-family: var(--mono); }
  .result-url { font-size: 13px; color: var(--text-dim); margin-top: 10px; word-break: break-all; font-family: var(--mono); }

  /* ---------- History ---------- */
  .history-box .panel-head span { font-family: var(--mono); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; padding: 10px 18px; color: var(--text-faint); font-weight: 500; font-size: 11.5px;
    border-bottom: 1px solid var(--border);
  }
  td { text-align: left; padding: 10px 18px; border-bottom: 1px solid var(--border-soft); color: var(--text-dim); }
  td.url-cell { font-family: var(--mono); color: var(--text); word-break: break-all; }
  tr:last-child td { border-bottom: none; }
  .empty-row td { color: var(--text-faint); text-align: center; padding: 24px 18px; }

  @media (prefers-reduced-motion: reduce) {
    #checkBtn.scanning .sweep { animation: none; display: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
      <path d="M12 2 4 5v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V5l-8-3Z" stroke="#f0b429" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M9 12l2 2 4-4.5" stroke="#f0b429" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>URL Scanner</h1>
  </div>
  <p class="subtitle">Paste a link before you open it. Sign in and each check is saved to your history.</p>

  <!-- Signed-out auth -->
  <div class="panel" id="authPanel">
    <div class="panel-head"><span>sign in</span></div>
    <div class="panel-pad">
      <button id="googleBtn">
        <svg width="17" height="17" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.9 0 6.6 1.7 8.1 3.1l6-6C34.9 3.2 30 1 24 1 14.9 1 7.1 6.4 3.5 14.1l7.1 5.5C12.4 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.2 5.5-4.7 7.2l7.2 5.6C43.9 37.6 46.5 31.6 46.5 24.5z"/><path fill="#FBBC05" d="M10.6 19.6a14.5 14.5 0 000 8.8l-7.1 5.5A24 24 0 010 24c0-3.1.7-6 2-8.6z"/><path fill="#34A853" d="M24 46.5c6.5 0 12-2.1 15.9-5.7l-7.2-5.6c-2 1.4-4.7 2.3-8.7 2.3-6.3 0-11.6-4-13.5-9.6l-7.1 5.5C7.1 41.6 14.9 46.5 24 46.5z"/></svg>
        Continue with Google
      </button>

      <div class="divider">or use email</div>

      <form id="emailAuthForm" novalidate>
        <div class="field">
          <label for="emailInput">Email</label>
          <input id="emailInput" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="passwordInput">Password</label>
          <input id="passwordInput" type="password" autocomplete="current-password" required minlength="6">
        </div>
        <div class="auth-actions">
          <button id="emailLoginBtn" type="submit" class="btn btn-primary">Log in</button>
          <button id="emailSignUpBtn" type="submit" class="btn btn-ghost">Sign up</button>
        </div>
        <div class="auth-foot">
          <button type="button" class="link-btn" id="forgotBtn">Forgot password?</button>
        </div>
        <div class="form-msg" id="emailAuthMsg"></div>
      </form>
    </div>
  </div>

  <!-- Signed-in bar -->
  <div class="panel" id="userBar">
    <div class="user-id">
      <img id="userPhoto" src="" alt="" style="display:none;">
      <div class="avatar-fallback" id="userInitial" style="display:none;"></div>
      <div class="who">
        <div class="name" id="userName"></div>
        <div class="status">Signed in</div>
      </div>
    </div>
    <div class="user-actions">
      <button class="icon-btn" id="pwToggleBtn" title="Change password" aria-label="Change password">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 15v3m-5-3h10a2 2 0 002-2v-3a2 2 0 00-2-2H7a2 2 0 00-2 2v3a2 2 0 002 2z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 8V6a4 4 0 118 0v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="signOutBtn" title="Sign out" aria-label="Sign out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div id="verifyBanner">
    Verify your email to confirm it's yours — <a href="#" id="resendVerifyLink">resend verification email</a>
  </div>

  <!-- Change password -->
  <div class="panel" id="pwPanel">
    <div class="panel-head"><span>change password</span></div>
    <div class="panel-pad" id="pwPanelBody"><!-- filled by JS: form or google-account note --></div>
  </div>

  <!-- Scanner -->
  <div class="scan-row">
    <input id="urlInput" type="text" placeholder="https://example.com/login">
    <button id="checkBtn"><span class="sweep"></span><span class="label">Scan</span></button>
  </div>

  <div id="result"></div>

  <div class="panel history-box">
    <div class="panel-head"><span>history</span></div>
    <table id="historyTable">
      <thead><tr><th>Time</th><th>URL</th><th>Result</th><th>Confidence</th></tr></thead>
      <tbody id="historyBody"><tr class="empty-row"><td colspan="4">Sign in to save your checks here.</td></tr></tbody>
    </table>
  </div>

</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
    createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification,
    sendPasswordResetEmail, updatePassword, reauthenticateWithCredential, EmailAuthProvider
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ---------------------------------------------------------------------
  // REPLACE THIS with your own Firebase project config
  // (Firebase Console → Project Settings → General → Your apps → SDK config)
  // ---------------------------------------------------------------------
  const firebaseConfig = {
    apiKey: "AIzaSyD2j4-Y1wvX1X54FrT7cte-cQv6IEFeaZA",
    authDomain: "phishing-url-detector-f93a0.firebaseapp.com",
    projectId: "phishing-url-detector-f93a0",
    storageBucket: "phishing-url-detector-f93a0.firebasestorage.app",
    messagingSenderId: "810147676792",
    appId: "1:810147676792:web:5d0dd0c96d6233dd9d638d"
  };

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);
  const provider = new GoogleAuthProvider();

  let currentUser = null;

  const $ = (id) => document.getElementById(id);

  // ---------------- Google sign-in ----------------
  $("googleBtn").onclick = () => signInWithPopup(auth, provider).catch((err) => setEmailAuthMsg(friendlyAuthError(err), true));
  $("signOutBtn").onclick = () => {
    signOut(auth);
    $("emailInput").value = "";
    $("passwordInput").value = "";
    setEmailAuthMsg("");
    $("pwPanel").style.display = "none";
  };

  // ---------------- Email / password sign-in ----------------
  function friendlyAuthError(err) {
    const map = {
      "auth/email-already-in-use": "An account with that email already exists — try logging in instead.",
      "auth/invalid-email": "That doesn't look like a valid email address.",
      "auth/weak-password": "Password must be at least 6 characters.",
      "auth/invalid-credential": "Incorrect email or password.",
      "auth/wrong-password": "Incorrect email or password.",
      "auth/user-not-found": "No account found with that email — try signing up instead.",
      "auth/too-many-requests": "Too many attempts — please wait a moment and try again.",
      "auth/missing-password": "Enter a password.",
    };
    return map[err.code] || err.message;
  }

  function setEmailAuthMsg(message, isErr) {
    const el = $("emailAuthMsg");
    el.innerText = message || "";
    el.className = "form-msg" + (message ? (isErr === false ? " ok" : " err") : "");
  }

  $("emailAuthForm").addEventListener("submit", async (e) => {
    e.preventDefault(); // a real form submit is what lets the browser's password
    // manager recognize this as a login and offer to save the credentials.
    const email = $("emailInput").value.trim();
    const password = $("passwordInput").value;
    const action = e.submitter?.id === "emailSignUpBtn" ? "signup" : "login";
    setEmailAuthMsg("");
    if (!email || !password) return setEmailAuthMsg("Enter an email and password first.", true);

    try {
      if (action === "signup") {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await sendEmailVerification(cred.user);
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
    } catch (err) {
      console.error(err);
      setEmailAuthMsg(friendlyAuthError(err), true);
    }
  });

  $("forgotBtn").onclick = async () => {
    const email = $("emailInput").value.trim();
    if (!email) return setEmailAuthMsg("Enter your email above first, then click \u201cForgot password?\u201d again.", true);
    try {
      await sendPasswordResetEmail(auth, email);
      setEmailAuthMsg("Password reset email sent — check your inbox.", false);
    } catch (err) {
      console.error(err);
      setEmailAuthMsg(friendlyAuthError(err), true);
    }
  };

  // ---------------- Change password (signed-in users) ----------------
  function isGoogleOnly(user) {
    return user.providerData.length > 0 && user.providerData.every((p) => p.providerId === "google.com");
  }

  function renderPwPanelBody() {
    const body = $("pwPanelBody");
    if (!currentUser) { body.innerHTML = ""; return; }

    if (isGoogleOnly(currentUser)) {
      body.innerHTML = `<p class="pw-note">Your account uses Google Sign-In, so there's no separate password to change here — manage it from your Google Account settings instead.</p>`;
      return;
    }

    body.innerHTML = `
      <div class="field">
        <label for="pwCurrent">Current password</label>
        <input id="pwCurrent" type="password" autocomplete="current-password">
      </div>
      <div class="field">
        <label for="pwNew">New password</label>
        <input id="pwNew" type="password" autocomplete="new-password" minlength="6">
      </div>
      <div class="field">
        <label for="pwConfirm">Confirm new password</label>
        <input id="pwConfirm" type="password" autocomplete="new-password" minlength="6">
      </div>
      <div class="auth-actions">
        <button id="pwSubmitBtn" class="btn btn-primary" type="button">Update password</button>
        <button id="pwCancelBtn" class="btn btn-ghost" type="button">Cancel</button>
      </div>
      <div class="form-msg" id="pwMsg"></div>
    `;

    $("pwCancelBtn").onclick = () => { $("pwPanel").style.display = "none"; };

    $("pwSubmitBtn").onclick = async () => {
      const current = $("pwCurrent").value;
      const next = $("pwNew").value;
      const confirm = $("pwConfirm").value;
      const msg = $("pwMsg");
      const setMsg = (t, isErr) => { msg.innerText = t || ""; msg.className = "form-msg" + (t ? (isErr === false ? " ok" : " err") : ""); };

      setMsg("");
      if (!current || !next || !confirm) return setMsg("Fill in all three fields.", true);
      if (next.length < 6) return setMsg("New password must be at least 6 characters.", true);
      if (next !== confirm) return setMsg("New password and confirmation don't match.", true);

      $("pwSubmitBtn").disabled = true;
      try {
        const credential = EmailAuthProvider.credential(currentUser.email, current);
        await reauthenticateWithCredential(currentUser, credential);
        await updatePassword(currentUser, next);
        setMsg("Password updated.", false);
        $("pwCurrent").value = ""; $("pwNew").value = ""; $("pwConfirm").value = "";
      } catch (err) {
        console.error(err);
        setMsg(friendlyAuthError(err), true);
      } finally {
        $("pwSubmitBtn").disabled = false;
      }
    };
  }

  $("pwToggleBtn").onclick = () => {
    const panel = $("pwPanel");
    const showing = panel.style.display === "block";
    if (showing) { panel.style.display = "none"; return; }
    renderPwPanelBody();
    panel.style.display = "block";
  };

  // ---------------- Auth state ----------------
  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    $("pwPanel").style.display = "none";

    if (user) {
      $("authPanel").style.display = "none";
      $("userBar").style.display = "flex";

      if (user.photoURL) {
        $("userPhoto").src = user.photoURL;
        $("userPhoto").style.display = "block";
        $("userInitial").style.display = "none";
      } else {
        $("userPhoto").style.display = "none";
        $("userInitial").style.display = "flex";
        $("userInitial").innerText = (user.displayName || user.email || "?").charAt(0).toUpperCase();
      }
      $("userName").innerText = user.displayName || user.email;

      const verifyBanner = $("verifyBanner");
      if (!isGoogleOnly(user) && !user.emailVerified) {
        verifyBanner.style.display = "block";
        verifyBanner.innerHTML = `Verify your email to confirm it's yours — <a href="#" id="resendVerifyLink">resend verification email</a>`;
        $("resendVerifyLink").onclick = resendVerification;
      } else {
        verifyBanner.style.display = "none";
      }

      loadHistory(user.uid);
    } else {
      $("authPanel").style.display = "block";
      $("userBar").style.display = "none";
      $("verifyBanner").style.display = "none";
      $("historyBody").innerHTML = "<tr class='empty-row'><td colspan='4'>Sign in to save your checks here.</td></tr>";
    }
  });

  async function resendVerification(e) {
    e.preventDefault();
    if (!currentUser) return;
    try {
      await sendEmailVerification(currentUser);
      $("verifyBanner").innerHTML = "Verification email sent — check your inbox.";
    } catch (err) {
      console.error(err);
    }
  }

  // ---------------- History ----------------
  function loadHistory(uid) {
    // Each user's checks live in their own subcollection (users/{uid}/checks)
    // instead of one shared "checks" collection filtered by a uid field.
    // That avoids needing a Firestore composite index (uid + createdAt).
    const q = query(collection(db, "users", uid, "checks"), orderBy("createdAt", "desc"), limit(10));
    onSnapshot(
      q,
      (snapshot) => {
        const rows = [];
        snapshot.forEach((doc) => {
          const d = doc.data();
          const time = d.createdAt?.toDate ? d.createdAt.toDate().toLocaleTimeString() : "";
          const label = d.prediction === "Legitimate" ? "Legitimate" : "Phishing";
          rows.push(`<tr><td>${time}</td><td class="url-cell">${d.url}</td><td>${label}</td><td>${d.confidence}%</td></tr>`);
        });
        $("historyBody").innerHTML = rows.length ? rows.join("") : "<tr class='empty-row'><td colspan='4'>No checks yet.</td></tr>";
      },
      (error) => {
        console.error("History query failed:", error);
        $("historyBody").innerHTML = `<tr class="empty-row"><td colspan="4" style="color:var(--danger);">Couldn't load history: ${error.message}</td></tr>`;
      }
    );
  }

  async function saveCheck(url, prediction, confidence) {
    if (!currentUser) return;
    await addDoc(collection(db, "users", currentUser.uid, "checks"), {
      url, prediction, confidence,
      createdAt: serverTimestamp(),
    }).catch((err) => console.error("Failed to save check:", err));
  }

  // ---------------- Scanning ----------------
  async function checkUrl() {
    const url = $("urlInput").value.trim();
    const resultDiv = $("result");
    const btn = $("checkBtn");
    if (!url) return;

    btn.classList.add("scanning");
    btn.disabled = true;
    btn.querySelector(".label").innerText = "Scanning";
    resultDiv.style.display = "none";

    try {
      const res = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url })
      });
      const data = await res.json();

      if (data.error) {
        resultDiv.style.display = "block";
        resultDiv.className = "";
        resultDiv.innerHTML = `<div class="result-label">${data.error}</div>`;
        return;
      }

      const isLegit = data.prediction === "Legitimate";
      const confidence = isLegit ? data.prob_legitimate : data.prob_phishing;
      resultDiv.style.display = "block";
      resultDiv.className = isLegit ? "legit" : "phish";
      resultDiv.innerHTML = `
        <div class="result-top">
          <div class="result-label">${isLegit ? "Looks legitimate" : "Phishing detected"}</div>
          <div class="result-conf">${(confidence * 100).toFixed(2)}% confidence</div>
        </div>
        <div class="result-url">${data.url}</div>
      `;

      saveCheck(data.url, data.prediction, (confidence * 100).toFixed(1));
    } finally {
      btn.classList.remove("scanning");
      btn.disabled = false;
      btn.querySelector(".label").innerText = "Scan";
    }
  }

  $("checkBtn").onclick = checkUrl;
  $("urlInput").addEventListener("keydown", (e) => { if (e.key === "Enter") checkUrl(); });
</script>
</body>
</html>
