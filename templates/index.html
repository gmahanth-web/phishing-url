<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phishing URL Detector</title>
<style>
  :root { --accent: #6366f1; --accent2: #8b5cf6; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
    color: #f3f4f6; margin: 0; min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 20px; }
  h1 {
    text-align: center; font-size: 32px; font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }
  .subtitle { text-align: center; color: #9ca3af; margin-bottom: 24px; }

  .auth-bar { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 24px; }
  #signInBtn {
    background: #fff; color: #1f2937; border: none; padding: 10px 18px;
    border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;
  }
  #userInfo { display: none; align-items: center; gap: 10px; }
  #userInfo img { width: 32px; height: 32px; border-radius: 50%; }
  #signOutBtn { background: #374151; color: #f3f4f6; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; }

  .divider { text-align: center; color: #6b7280; font-size: 12px; margin: 4px 0 16px; }
  .email-auth-box { max-width: 320px; margin: 0 auto 20px; }
  .email-auth-box input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #374151;
    background: #1f2937; color: #f3f4f6; font-size: 14px; margin-bottom: 8px; box-sizing: border-box;
  }
  .email-auth-buttons { display: flex; gap: 8px; }
  .email-auth-buttons button {
    flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 13px;
  }
  #emailLoginBtn { background: var(--accent); color: #fff; }
  #emailLoginBtn:hover { background: var(--accent2); }
  #emailSignUpBtn { background: #374151; color: #f3f4f6; }
  #emailSignUpBtn:hover { background: #4b5563; }
  #emailAuthError { color: #ef4444; font-size: 12px; text-align: center; margin-top: 6px; min-height: 14px; }

  .input-row { display: flex; gap: 10px; margin-bottom: 20px; }
  #urlInput { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid #374151; background: #1f2937; color: #f3f4f6; font-size: 15px; }
  #checkBtn { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; }
  #checkBtn:hover { background: var(--accent2); }

  #result { display: none; border-radius: 16px; padding: 26px; text-align: center; margin-bottom: 24px; }
  .legit { background: linear-gradient(135deg, #0f2e1e, #123d27); box-shadow: 0 6px 24px rgba(16,185,129,0.18); }
  .phish { background: linear-gradient(135deg, #2e1414, #3d1717); box-shadow: 0 6px 24px rgba(239,68,68,0.2); }
  .result-icon { font-size: 44px; }
  .result-label { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .result-conf { font-size: 14px; color: #d1d5db; margin-top: 6px; }
  .result-url { font-size: 12px; color: #9ca3af; margin-top: 10px; word-break: break-all; }

  .history-box { background: #16161f; border-radius: 12px; padding: 16px; }
  .history-box h3 { margin-top: 0; font-size: 15px; color: #d1d5db; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #262633; }
  .signin-note { text-align: center; color: #6b7280; font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛡️ Phishing URL Detector</h1>
  <div class="subtitle">Sign in to save your check history across sessions</div>

  <div class="auth-bar">
    <button id="signInBtn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.9 0 6.6 1.7 8.1 3.1l6-6C34.9 3.2 30 1 24 1 14.9 1 7.1 6.4 3.5 14.1l7.1 5.5C12.4 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.2 5.5-4.7 7.2l7.2 5.6C43.9 37.6 46.5 31.6 46.5 24.5z"/><path fill="#FBBC05" d="M10.6 19.6a14.5 14.5 0 000 8.8l-7.1 5.5A24 24 0 010 24c0-3.1.7-6 2-8.6z"/><path fill="#34A853" d="M24 46.5c6.5 0 12-2.1 15.9-5.7l-7.2-5.6c-2 1.4-4.7 2.3-8.7 2.3-6.3 0-11.6-4-13.5-9.6l-7.1 5.5C7.1 41.6 14.9 46.5 24 46.5z"/></svg>
      Sign in with Google
    </button>
    <div id="userInfo">
      <img id="userPhoto" src="" alt="">
      <span id="userName"></span>
      <button id="signOutBtn">Sign out</button>
    </div>
  </div>

  <div class="signin-note" id="guestNote">Not signed in — you can still check URLs, but history won't be saved.</div>

  <div class="divider" id="emailDivider">or sign in with email and password</div>
  <div class="email-auth-box" id="emailAuthBox">
    <input id="emailInput" type="email" placeholder="Email address" autocomplete="email">
    <input id="passwordInput" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
    <div class="email-auth-buttons">
      <button id="emailLoginBtn">Log in</button>
      <button id="emailSignUpBtn">Sign up</button>
    </div>
    <div id="emailAuthError"></div>
  </div>

  <div class="input-row">
    <input id="urlInput" type="text" placeholder="e.g. https://google.com">
    <button id="checkBtn">Check URL</button>
  </div>

  <div id="result"></div>

  <div class="history-box">
    <h3>📜 Your History</h3>
    <table id="historyTable">
      <thead><tr><th>Time</th><th>URL</th><th>Result</th><th>Confidence</th></tr></thead>
      <tbody id="historyBody"><tr><td colspan="4" style="color:#6b7280;">No checks yet.</td></tr></tbody>
    </table>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
           createUserWithEmailAndPassword, signInWithEmailAndPassword }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ---------------------------------------------------------------------
  // REPLACE THIS with your own Firebase project config
  // (Firebase Console → Project Settings → General → Your apps → SDK config)
  // ---------------------------------------------------------------------
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);
  const provider = new GoogleAuthProvider();

  let currentUser = null;

  document.getElementById("signInBtn").onclick = () => signInWithPopup(auth, provider).catch(console.error);
  document.getElementById("signOutBtn").onclick = () => {
    signOut(auth);
    document.getElementById("emailInput").value = "";
    document.getElementById("passwordInput").value = "";
    setEmailAuthError("");
  };

  // ---------------- Email / password sign-in ----------------
  function friendlyAuthError(err) {
    const map = {
      "auth/email-already-in-use": "An account with that email already exists — try logging in instead.",
      "auth/invalid-email": "That doesn't look like a valid email address.",
      "auth/weak-password": "Password must be at least 6 characters.",
      "auth/invalid-credential": "Incorrect email or password.",
      "auth/wrong-password": "Incorrect email or password.",
      "auth/user-not-found": "No account found with that email — try signing up instead.",
      "auth/too-many-requests": "Too many attempts — please wait a moment and try again.",
    };
    return map[err.code] || err.message;
  }

  function setEmailAuthError(message) {
    document.getElementById("emailAuthError").innerText = message || "";
  }

  document.getElementById("emailSignUpBtn").onclick = async () => {
    const email = document.getElementById("emailInput").value.trim();
    const password = document.getElementById("passwordInput").value;
    setEmailAuthError("");
    if (!email || !password) return setEmailAuthError("Enter an email and password first.");
    try {
      await createUserWithEmailAndPassword(auth, email, password);
    } catch (err) {
      console.error(err);
      setEmailAuthError(friendlyAuthError(err));
    }
  };

  document.getElementById("emailLoginBtn").onclick = async () => {
    const email = document.getElementById("emailInput").value.trim();
    const password = document.getElementById("passwordInput").value;
    setEmailAuthError("");
    if (!email || !password) return setEmailAuthError("Enter an email and password first.");
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      console.error(err);
      setEmailAuthError(friendlyAuthError(err));
    }
  };

  document.getElementById("passwordInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("emailLoginBtn").click();
  });

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if (user) {
      document.getElementById("signInBtn").style.display = "none";
      document.getElementById("guestNote").style.display = "none";
      document.getElementById("emailDivider").style.display = "none";
      document.getElementById("emailAuthBox").style.display = "none";
      document.getElementById("userInfo").style.display = "flex";
      document.getElementById("userPhoto").src = user.photoURL || "";
      document.getElementById("userName").innerText = user.displayName || user.email;
      loadHistory(user.uid);
    } else {
      document.getElementById("signInBtn").style.display = "flex";
      document.getElementById("guestNote").style.display = "block";
      document.getElementById("emailDivider").style.display = "block";
      document.getElementById("emailAuthBox").style.display = "block";
      document.getElementById("userInfo").style.display = "none";
      document.getElementById("historyBody").innerHTML = "<tr><td colspan='4' style='color:#6b7280;'>Sign in to see saved history.</td></tr>";
    }
  });

  function loadHistory(uid) {
    // Each user's checks live in their own subcollection (users/{uid}/checks)
    // instead of one shared "checks" collection filtered by a uid field.
    // That avoids needing a Firestore composite index (uid + createdAt),
    // which is what was silently breaking history before: the old query
    // required an index that was never created, so it failed on every
    // read with no visible error, and just looked like "no history."
    const q = query(collection(db, "users", uid, "checks"), orderBy("createdAt", "desc"), limit(10));
    onSnapshot(
      q,
      (snapshot) => {
        const rows = [];
        snapshot.forEach((doc) => {
          const d = doc.data();
          const time = d.createdAt?.toDate ? d.createdAt.toDate().toLocaleTimeString() : "";
          const icon = d.prediction === "Legitimate" ? "✅" : "🚨";
          rows.push(`<tr><td>${time}</td><td style="word-break:break-all;">${d.url}</td><td>${icon} ${d.prediction}</td><td>${d.confidence}%</td></tr>`);
        });
        document.getElementById("historyBody").innerHTML = rows.length ? rows.join("") : "<tr><td colspan='4' style='color:#6b7280;'>No checks yet.</td></tr>";
      },
      (error) => {
        // Surface query/permission errors instead of failing silently.
        console.error("History query failed:", error);
        document.getElementById("historyBody").innerHTML =
          `<tr><td colspan='4' style='color:#ef4444;'>Couldn't load history: ${error.message}</td></tr>`;
      }
    );
  }

  async function saveCheck(url, prediction, confidence) {
    if (!currentUser) return;
    await addDoc(collection(db, "users", currentUser.uid, "checks"), {
      url, prediction, confidence,
      createdAt: serverTimestamp(),
    }).catch((err) => console.error("Failed to save check:", err));
  }

  async function checkUrl() {
    const url = document.getElementById("urlInput").value.trim();
    const resultDiv = document.getElementById("result");
    if (!url) return;

    resultDiv.style.display = "block";
    resultDiv.className = "";
    resultDiv.innerHTML = "Checking...";

    const res = await fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url })
    });
    const data = await res.json();

    if (data.error) {
      resultDiv.innerText = data.error;
      return;
    }

    const isLegit = data.prediction === "Legitimate";
    const confidence = isLegit ? data.prob_legitimate : data.prob_phishing;
    resultDiv.className = isLegit ? "legit" : "phish";
    resultDiv.innerHTML = `
      <div class="result-icon">${isLegit ? "✅" : "🚨"}</div>
      <div class="result-label">${isLegit ? "Legitimate" : "Phishing Detected"}</div>
      <div class="result-conf">Confidence: ${(confidence * 100).toFixed(2)}%</div>
      <div class="result-url">${data.url}</div>
    `;

    saveCheck(data.url, data.prediction, (confidence * 100).toFixed(1));
  }

  document.getElementById("checkBtn").onclick = checkUrl;
  document.getElementById("urlInput").addEventListener("keydown", (e) => { if (e.key === "Enter") checkUrl(); });
</script>
</body>
</html>
